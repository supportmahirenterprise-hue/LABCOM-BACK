name: Deploy to Droplet

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: 67.205.155.116
          username: root
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            echo "=== 1. Freeing disk space on droplet ==="
            journalctl --vacuum-time=1d || true
            pm2 flush || true
            npm cache clean --force || true
            rm -rf /root/.npm/_logs/* || true
            rm -rf /tmp/* || true
            apt-get clean || true
            df -h /

            echo "=== 2. Disk Space Usage Analysis ==="
            echo "--- Top Folders in /root ---"
            du -sh /root/* 2>/dev/null | sort -rh | head -15 || true
            echo "--- System & Cache Folders ---"
            du -sh /var/log /var/lib/snapd /root/.pm2 /root/.npm /var/lib/docker 2>/dev/null || true
            echo "--- Top 15 Largest Files/Folders on Server ---"
            du -ahx / 2>/dev/null | sort -rh | head -15 || true

            echo "=== 3. Pulling and restarting LABCOM-BACK ==="
            cd /root/LABCOM-BACK
            git clean -fd || true
            git reset --hard HEAD || true
            git pull origin main
            npm install --omit=dev
            pm2 describe LABCOM-BACK > /dev/null 2>&1 && pm2 restart LABCOM-BACK --update-env || pm2 start server.js --name LABCOM-BACK
            pm2 save
            pm2 status



